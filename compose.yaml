x-platform: &platform
  build: .
  env_file:
    - .env
    - .env.platform
  environment:
    DATABASE_URL: postgresql+psycopg://quantpilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.platform}@postgres:5432/quantpilot
  volumes:
    - research_data:/app/storage

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quantpilot
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quantpilot -d quantpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migration:
    <<: *platform
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *platform
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  engine:
    <<: *platform
    command: [python, -m, quantpilot.platform.engine]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
  testnet:
    <<: *platform
    command: [python, -m, quantpilot.platform.testnet_worker]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
  research:
    <<: *platform
    command: [python, -m, quantpilot.platform.research_worker]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  research_data:
