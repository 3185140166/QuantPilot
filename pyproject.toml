[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot"
version = "0.1.0"
description = "A testnet-first Bybit quantitative trading research project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "pybit>=5.6",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["quantpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
