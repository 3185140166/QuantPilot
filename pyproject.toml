[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot"
version = "0.2.0"
description = "A testnet-first multi-exchange quantitative trading research project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "altair>=5.0",
  "numpy>=1.24",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "websocket-client>=1.8,<2",
  "pydantic>=2.0",
  "pybit>=5.17,<6",
  "loguru>=0.7",
  "streamlit>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
platform = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pyarrow>=17,<25",
  "optuna>=4.5,<6",
]

[tool.setuptools.packages.find]
include = ["quantpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
